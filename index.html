<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест Mini App</title>
  <!-- Подключаем Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 16px;
      cursor: pointer;
    }
    .option-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      text-align: left;
      cursor: pointer;
    }
    .option-btn.selected {
      border-color: var(--tg-theme-button-color, #2481cc);
      background-color: #e3f2fd;
    }
  </style>
</head>
<body>

  <h2>Тест по Python</h2>
  <div id="quiz" class="card">
    <p><strong>Вопрос:</strong> Какая библиотека используется для создания асинхронных ботов в Telegram на Python?</p>
    <button class="option-btn" onclick="selectAnswer(this, 'requests')">requests</button>
    <button class="option-btn" onclick="selectAnswer(this, 'aiogram')">aiogram</button>
    <button class="option-btn" onclick="selectAnswer(this, 'pandas')">pandas</button>
  </div>

  <button class="btn" onclick="sendResult()">Завершить тест</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем приложение на весь экран

    let selectedAnswer = '';

    function selectAnswer(element, answer) {
      document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
      selectedAnswer = answer;
    }

    function sendResult() {
      if (!selectedAnswer) {
        alert('Пожалуйста, выберите ответ!');
        return;
      }

      // Формируем данные для отправки боту
      const data = {
        answer: selectedAnswer,
        isCorrect: selectedAnswer === 'aiogram'
      };

      // Отправляем данные в чат с ботом и закрываем Web App
      tg.sendData(JSON.stringify(data));
    }
  </script>
</body>
</html>
